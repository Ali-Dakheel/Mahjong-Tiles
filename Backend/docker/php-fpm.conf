; PHP-FPM pool configuration for production

[www]
user = www-data
group = www-data

listen = /var/run/php/php8.4-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
pm.max_requests = 500

; Pass environment variables to PHP workers
clear_env = no

access.log = /dev/stdout
catch_workers_output = yes
